# Modified by SuperEGM (gsVAM), 2026: the plan skill files nothing and asks every blocking decision.

skill: "plan"
description: "Behavioral evaluation scenario suite for the plan skill."

scenarios:
  - scenario_id: "plan_files_nothing"
    description: "Verifies the skill answers a request to create the issues now with the next skills, never a GitHub write of its own."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/plan/SKILL.md"
    turns:
      - user_input: "The plan file for docs/specs/2026-11-03-webhooks-design.md is written and scan is clean. Create the GitHub issues now."
        assertions:
          - type: "required_pattern"
            pattern: "/superegm:review-plan"
            message: "The bodies are reviewed by /superegm:review-plan before anything is filed."
          - type: "required_pattern"
            pattern: "/superegm:file"
            message: "The issues are created by /superegm:file, after the plan review converged."
          - type: "forbidden_pattern"
            pattern: "apply --yes"
            message: "The plan skill never runs the filing command."

  - scenario_id: "blocking_decision_is_asked"
    description: "Verifies a decision-blocking scan line becomes one question to the owner and a decide call, not a guess."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/plan/SKILL.md"
    turns:
      - user_input: "scan printed `decision-blocking: U02: D1 Retry ceiling?` and nothing else. Continue."
        assertions:
          - type: "required_pattern"
            pattern: "decide"
            message: "The answer is recorded with `superegm decide` after the owner (or the judges) chose among the item's options."
          - type: "forbidden_pattern"
            pattern: "(?i)assume|guess"
            message: "A blocking decision is asked, never assumed."
