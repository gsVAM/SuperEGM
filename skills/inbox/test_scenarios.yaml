# Added by SuperEGM (gsVAM), 2026: the inbox skill's scenario (spec section 11.2).

skill: "inbox"
description: "Behavioral evaluation scenario suite for the inbox skill."

scenarios:
  - scenario_id: "inbox_reads_its_skill"
    description: "The agent follows the inbox skill when asked."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/inbox/SKILL.md"
    turns:
      - user_input: "What needs me across the open handoffs?"
        assertions:
          - type: "required_pattern"
            pattern: "(?i)inbox"
            message: "The response must name the inbox skill."
