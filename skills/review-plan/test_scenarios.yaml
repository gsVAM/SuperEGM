skill: "review-plan"
description: "Behavioral evaluation scenario suite for the review-plan skill."

scenarios:
  - scenario_id: "review_plan_reads_its_skill"
    description: "The agent follows the review-plan skill when asked."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/review-plan/SKILL.md"
    turns:
      - user_input: "Review the handoff plan at artifacts/handoff_plan.md."
        assertions:
          - type: "required_pattern"
            pattern: "(?i)review-plan"
            message: "The response must name the review-plan skill."
