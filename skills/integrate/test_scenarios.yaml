skill: "integrate"
description: "Behavioral evaluation scenario suite for the integrate skill."

scenarios:
  - scenario_id: "integrate_reads_its_skill"
    description: "The agent follows the integrate skill when asked."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/integrate/SKILL.md"
    turns:
      - user_input: "Integrate the landed units."
        assertions:
          - type: "required_pattern"
            pattern: "(?i)integrate"
            message: "The response must name the integrate skill."
